name: Unify main tables

on:
  push:
    branches:
      - ui/unified-main-tables

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[unified-table-migration]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/unified-main-tables
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: node scripts/unifyMainTables.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/hr-table/HrEntityTable.tsx src/pages/recruitment/CandidatesPage.tsx src/pages/access/AccessControlPage.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Migrate main registries to shared DataTable [unified-table-migration]"
          git push origin HEAD:ui/unified-main-tables
