name: Scan icon buttons

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find icon-only button candidates
        shell: bash
        run: |
          echo '=== p-0 buttons ==='
          grep -RIn -B3 -A5 'p-0' src --include='*.tsx' || true
          echo '=== table action buttons ==='
          grep -RIn -B3 -A5 'app-table-action-button' src --include='*.tsx' || true
          echo '=== aria-label buttons ==='
          grep -RIn -B2 -A4 'aria-label=' src --include='*.tsx' || true
