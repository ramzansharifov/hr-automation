name: Restore icon refactor targets

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  restore:
    if: github.head_ref == 'fix/skill-fields-and-icon-buttons'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/skill-fields-and-icon-buttons
          fetch-depth: 0
      - name: Restore application targets from main
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- \
            src/pages/recruitment/CandidatesPage.tsx \
            src/pages/recruitment/VacanciesPage.tsx \
            src/pages/recruitment/VacancyFormPage.tsx \
            src/pages/VacationsPage.tsx \
            src/shared/ui/DropdownMenu.tsx \
            src/shared/ui/Dialog.tsx \
            src/features/employees/related-records/RelatedRecordCards.tsx \
            src/features/employees/components/EmployeeOperationalRecords.tsx \
            src/features/hr-table/HrEntityTable.tsx \
            src/pages/access/AccessControlPage.tsx
      - name: Commit restoration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "Nothing to restore"
          else
            git commit -m "Restore icon refactor targets before safe migration"
            git push origin HEAD:fix/skill-fields-and-icon-buttons
          fi
