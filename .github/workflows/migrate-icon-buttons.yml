name: Apply safe icon refactor

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/skill-fields-and-icon-buttons'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/skill-fields-and-icon-buttons
          fetch-depth: 0
      - name: Apply exact replacements
        run: python .github/scripts/apply_safe_icon_refactor.py
      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No application changes"
          else
            git commit -m "Clarify skill fields and standardize icon buttons"
            git push origin HEAD:fix/skill-fields-and-icon-buttons
          fi
