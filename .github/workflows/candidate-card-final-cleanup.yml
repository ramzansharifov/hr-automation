name: Candidate card final cleanup

on:
  push:
    branches:
      - ui/candidate-card-redesign

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[candidate-card-final-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/candidate-card-redesign
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: node scripts/removeUnusedCandidateStatusOptions.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Remove obsolete candidate status options [candidate-card-final-cleanup]"
          git push origin HEAD:ui/candidate-card-redesign
