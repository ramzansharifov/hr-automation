name: Refactor section headers in PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'refactor/unified-section-headers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Run migration
        run: python .github/scripts/migrate_section_headers.py
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No migration changes"
          else
            git commit -m "Migrate all sections to unified PageHeader"
            git push origin HEAD:${{ github.head_ref }}
          fi
